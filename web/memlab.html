<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemLab — memoria, punteros y bits en C++</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2358a6ff'/><text x='16' y='23' font-size='17' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%230d1117'>0x</text></svg>">
<style>
/* MemLab web: paleta oscura, tarjetas y tipografia monoespaciada para que
   todos los volcados de memoria conserven su alineacion. */
:root {
  --fondo: #0d1117;
  --fondo-2: #151b23;
  --tarjeta: #161b22;
  --borde: #2a3441;
  --texto: #d7e0ea;
  --tenue: #8b98a8;
  --acento: #58a6ff;
  --rojo: #ff7b72;
  --verde: #56d364;
  --amarillo: #e3b341;
  --azul: #79c0ff;
  --magenta: #d2a8ff;
  --cian: #56d4dd;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding-bottom: 8.5rem;
  background: var(--fondo);
  color: var(--texto);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

/* --- cabecera ---------------------------------------------------------- */
.cabecera {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  background: linear-gradient(180deg, #161d27, var(--fondo-2));
  border-bottom: 1px solid var(--borde);
}
.marca { display: flex; align-items: center; gap: .9rem; }
.logo {
  font-family: var(--mono);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--fondo);
  background: var(--acento);
  padding: .3rem .55rem;
  border-radius: .5rem;
}
.cabecera h1 { margin: 0; font-size: 1.35rem; letter-spacing: .5px; }
.lema { margin: 0; color: var(--tenue); font-size: .85rem; }

.controles { display: flex; gap: .9rem; align-items: flex-end; flex-wrap: wrap; }
.controles label {
  display: flex; flex-direction: column; gap: .25rem;
  font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--tenue);
}
select, input[type="number"], input[type="text"] {
  background: var(--fondo);
  border: 1px solid var(--borde);
  color: var(--texto);
  border-radius: .45rem;
  padding: .45rem .6rem;
  font-family: var(--mono);
  font-size: .9rem;
}
select:focus, input:focus { outline: 2px solid var(--acento); outline-offset: 1px; }

button {
  background: var(--acento);
  color: #06101d;
  border: 0;
  border-radius: .45rem;
  padding: .5rem .95rem;
  font-weight: 600;
  font-size: .9rem;
  cursor: pointer;
}
button:hover:not(:disabled) { filter: brightness(1.12); }
button:disabled { opacity: .45; cursor: not-allowed; }

/* --- barra de progreso ------------------------------------------------- */
.progreso {
  position: sticky;
  top: var(--alto-cabecera, 4.6rem);
  z-index: 29;
  padding: .7rem 1.5rem;
  background: var(--fondo-2);
  border-bottom: 1px solid var(--borde);
}
.progreso-datos {
  display: flex; justify-content: space-between; gap: 1rem;
  font-size: .82rem; color: var(--tenue); margin-bottom: .4rem;
}
#etiqueta-nivel { color: var(--texto); font-weight: 600; }
.barra { height: 6px; background: #0b0f14; border-radius: 99px; overflow: hidden; }
.barra-relleno {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--acento), var(--verde));
  transition: width .35s ease;
}

/* --- flujo del juego --------------------------------------------------- */
#flujo { max-width: 900px; margin: 0 auto; padding: 1.25rem 1.25rem 0; }

.titulo {
  margin: 1.75rem 0 .75rem;
  padding: .7rem 1rem;
  font-size: 1.05rem;
  font-weight: 700;
  border-left: 4px solid var(--acento);
  background: linear-gradient(90deg, rgba(88,166,255,.16), transparent);
  border-radius: .3rem;
}

.caja {
  margin: .7rem 0;
  background: var(--tarjeta);
  border: 1px solid var(--borde);
  border-radius: .6rem;
  overflow: hidden;
}
.caja-encabezado {
  padding: .5rem .85rem;
  background: #1c2430;
  border-bottom: 1px solid var(--borde);
  color: var(--amarillo);
  font-weight: 600;
  font-size: .88rem;
}
.caja-cuerpo, .fila { padding: 0 .85rem; }
.caja-cuerpo { padding-top: .6rem; padding-bottom: .6rem; }

/* Todo el contenido del juego usa monoespaciado: es lo que mantiene
   alineados los volcados, las tablas de bits y las celdas de los arreglos. */
.fila, .mono, .codigo, .linea, .pregunta, .resultado {
  font-family: var(--mono);
  font-size: .85rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.codigo {
  margin: .7rem 0;
  padding: .75rem .9rem;
  background: #10161e;
  border: 1px solid var(--borde);
  border-left: 3px solid var(--verde);
  border-radius: .5rem;
  color: var(--verde);
  overflow-x: auto;
  white-space: pre;
}

.mono {
  margin: .5rem 0;
  padding: .6rem .8rem;
  background: #0b0f14;
  border: 1px solid var(--borde);
  border-radius: .5rem;
  overflow-x: auto;
  white-space: pre;
  font-size: .82rem;
}

.linea { padding: .1rem .2rem; }
.separador { height: 1px; margin: 1.25rem 0; background: var(--borde); border: 0; }

.pregunta {
  margin: .9rem 0;
  padding: .75rem .9rem;
  background: rgba(227,179,65,.09);
  border: 1px solid rgba(227,179,65,.35);
  border-radius: .5rem;
  color: #f0d38a;
  font-size: .95rem;
}

.eco {
  margin: .35rem 0;
  padding: .3rem .6rem;
  color: var(--acento);
  font-family: var(--mono);
  font-size: .85rem;
  border-left: 2px solid var(--acento);
}

/* colores heredados de los codigos ANSI del motor */
.c-31 { color: var(--rojo); }
.c-32 { color: var(--verde); }
.c-33 { color: var(--amarillo); }
.c-34 { color: var(--azul); }
.c-35 { color: var(--magenta); }
.c-36 { color: var(--cian); }
.c-90 { color: var(--tenue); }
.c-1  { font-weight: 700; color: #fff; }

/* --- entrada ----------------------------------------------------------- */
.zona-entrada {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: .75rem 1.25rem 1rem;
  z-index: 30;
  background: var(--fondo-2);
  border-top: 1px solid var(--borde);
  box-shadow: 0 -10px 24px rgba(0,0,0,.45);
}
.atajos {
  display: flex; flex-wrap: wrap; gap: .4rem;
  max-width: 900px; margin: 0 auto .55rem;
}
.atajos button {
  background: #22303f; color: var(--texto);
  font-family: var(--mono); font-size: .78rem; font-weight: 500;
  padding: .3rem .7rem; border: 1px solid var(--borde);
}
.atajos button:hover:not(:disabled) { background: #2c3d50; }

.linea-entrada { display: flex; gap: .55rem; max-width: 900px; margin: 0 auto; align-items: center; }
.prompt { font-family: var(--mono); color: var(--cian); font-weight: 700; white-space: nowrap; }
#campo { flex: 1; }

@media (max-width: 640px) {
  .cabecera { padding: .85rem 1rem; }
  .controles { width: 100%; }
  #flujo { padding: 1rem .75rem 0; }
  .zona-entrada { padding: .6rem .75rem .8rem; }
}

</style>
</head>
<body>
<header class="cabecera">
  <div class="marca">
    <span class="logo">0x</span>
    <div>
      <h1>MemLab</h1>
      <p class="lema">memoria, punteros y bits en C++ &mdash; el mismo motor, compilado a WebAssembly</p>
    </div>
  </div>
  <div class="controles">
    <label>Nivel
      <select id="selector-nivel">
        <option value="0">Todos</option>
      </select>
    </label>
    <label>Semilla
      <input id="campo-semilla" type="number" min="0" max="65535" value="7">
    </label>
    <button id="boton-nueva" type="button">Nueva partida</button>
  </div>
</header>

<div class="progreso">
  <div class="progreso-datos">
    <span id="etiqueta-nivel">Cargando WebAssembly&hellip;</span>
    <span id="etiqueta-puntos"></span>
  </div>
  <div class="barra"><div class="barra-relleno" id="barra-relleno"></div></div>
</div>

<main id="flujo" aria-live="polite"></main>

<form class="zona-entrada" id="formulario" autocomplete="off">
  <div class="atajos" id="atajos"></div>
  <div class="linea-entrada">
    <span class="prompt" id="prompt">memlab&gt;</span>
    <input id="campo" type="text" placeholder="Escribe tu respuesta y pulsa Enter" autofocus disabled>
    <button type="submit" id="boton-enviar" disabled>Enviar</button>
  </div>
</form>

<script>
// MemLab web: conecta el motor C++ (compilado a WebAssembly) con la pagina.
//
// El motor no sabe nada de HTML: emite lineas de texto con marcas de control
// que aqui se convierten en nodos del DOM. El texto nunca se interpreta como
// HTML (se inserta con textContent), asi que no hay forma de inyectar marcado.
//
// 'crearMemLab' lo define wasm/memlab.js, que se carga antes que este archivo.

// Marcas de estructura; deben coincidir con las de include/ui.hpp.
const MARCA = {
  colorInicio: '\x02',
  colorTexto: '\x03',
  colorFin: '\x04',
  caja: '\x05',
  fin: '\x06',
  titulo: '\x07',
  codigo: '\x08',
  mono: '\x0b',
  separador: '\x0e',
  estado: '\x10',
  finPartida: '\x11',
  pregunta: '\x12',
};

const flujo = document.getElementById('flujo');
const campo = document.getElementById('campo');
const prompt = document.getElementById('prompt');
const formulario = document.getElementById('formulario');
const botonEnviar = document.getElementById('boton-enviar');
const botonNueva = document.getElementById('boton-nueva');
const selectorNivel = document.getElementById('selector-nivel');
const campoSemilla = document.getElementById('campo-semilla');
const etiquetaNivel = document.getElementById('etiqueta-nivel');
const etiquetaPuntos = document.getElementById('etiqueta-puntos');
const barra = document.getElementById('barra-relleno');
const atajos = document.getElementById('atajos');

// --- traduccion de una linea del motor a nodos del DOM --------------------

// Convierte "\x02CODIGO\x03texto\x04" en <span class="c-CODIGO">texto</span>,
// dejando el resto como texto plano.
function nodosDeTexto(linea) {
  const trozo = document.createDocumentFragment();
  let i = 0;
  while (i < linea.length) {
    const inicio = linea.indexOf(MARCA.colorInicio, i);
    if (inicio === -1) {
      trozo.append(document.createTextNode(linea.slice(i)));
      break;
    }
    if (inicio > i) trozo.append(document.createTextNode(linea.slice(i, inicio)));

    const sep = linea.indexOf(MARCA.colorTexto, inicio);
    const fin = linea.indexOf(MARCA.colorFin, sep);
    if (sep === -1 || fin === -1) {   // marca incompleta: se muestra tal cual
      trozo.append(document.createTextNode(linea.slice(inicio)));
      break;
    }
    const span = document.createElement('span');
    span.className = 'c-' + linea.slice(inicio + 1, sep);
    span.append(nodosDeTexto(linea.slice(sep + 1, fin)));   // colores anidados
    trozo.append(span);
    i = fin + 1;
  }
  return trozo;
}

// --- construccion del flujo ----------------------------------------------

let bloqueAbierto = null;   // caja, bloque de codigo o bloque monoespaciado

function agregar(nodo) {
  (bloqueAbierto ?? flujo).append(nodo);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function abrirCaja(encabezado) {
  const caja = document.createElement('section');
  caja.className = 'caja';
  if (encabezado.trim() !== '') {
    const cab = document.createElement('div');
    cab.className = 'caja-encabezado';
    cab.append(nodosDeTexto(encabezado));
    caja.append(cab);
  }
  const cuerpo = document.createElement('div');
  cuerpo.className = 'caja-cuerpo';
  caja.append(cuerpo);
  flujo.append(caja);
  bloqueAbierto = cuerpo;
}

function abrirPreformateado(clase) {
  const pre = document.createElement('pre');
  pre.className = clase;
  flujo.append(pre);
  bloqueAbierto = pre;
}

function procesarLinea(linea) {
  const marca = linea.charAt(0);
  const resto = linea.slice(1);

  switch (marca) {
    case MARCA.estado:
      actualizarEstado(resto);
      return;
    case MARCA.finPartida:
      terminarPartida();
      return;
    case MARCA.pregunta: {
      bloqueAbierto = null;
      const p = document.createElement('div');
      p.className = 'pregunta';
      p.append(nodosDeTexto(resto));
      flujo.append(p);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      return;
    }
    case MARCA.titulo: {
      bloqueAbierto = null;
      const h = document.createElement('h2');
      h.className = 'titulo';
      h.append(nodosDeTexto(resto));
      flujo.append(h);
      return;
    }
    case MARCA.caja:
      bloqueAbierto = null;
      abrirCaja(resto);
      return;
    case MARCA.codigo:
      bloqueAbierto = null;
      abrirPreformateado('codigo');
      return;
    case MARCA.mono:
      bloqueAbierto = null;
      abrirPreformateado('mono');
      return;
    case MARCA.fin:
      bloqueAbierto = null;
      return;
    case MARCA.separador: {
      bloqueAbierto = null;
      const hr = document.createElement('hr');
      hr.className = 'separador';
      flujo.append(hr);
      return;
    }
    default:
      break;
  }

  if (bloqueAbierto instanceof HTMLPreElement) {
    bloqueAbierto.append(nodosDeTexto(linea), document.createTextNode('\n'));
    return;
  }

  const div = document.createElement('div');
  div.className = bloqueAbierto ? 'fila' : 'linea';
  div.append(nodosDeTexto(linea));
  agregar(div);
}

// El motor escribe por lineas, pero print() puede entregarlas sueltas: se
// acumulan aqui para no perder ninguna.
function escribir(texto) {
  for (const linea of String(texto).split('\n')) procesarLinea(linea);
}

// --- progreso -------------------------------------------------------------

function actualizarEstado(json) {
  let e;
  try { e = JSON.parse(json); } catch { return; }
  etiquetaNivel.textContent = `Nivel ${e.nivel} · ${e.nombreNivel} · reto ${e.reto}/${e.retos}`;
  etiquetaPuntos.textContent = `${e.puntos} / ${e.maximo} puntos`;
  barra.style.width = e.maximo > 0 ? `${(e.puntos / e.maximo) * 100}%` : '0%';
}

// --- entrada --------------------------------------------------------------

let resolverEntrada = null;

function terminarPartida() {
  resolverEntrada = null;
  bloqueAbierto = null;
  campo.disabled = true;
  botonEnviar.disabled = true;
  atajos.replaceChildren();
  prompt.textContent = 'fin';
  const aviso = document.createElement('div');
  aviso.className = 'linea c-90';
  aviso.textContent = 'Partida terminada. Pulsa "Nueva partida" para volver a empezar.';
  flujo.append(aviso);
}

function pedirLinea(textoPrompt) {
  prompt.textContent = textoPrompt.trim();
  ponerAtajos(textoPrompt.trim());
  campo.disabled = false;
  botonEnviar.disabled = false;
  campo.focus();
  return new Promise((resolve) => { resolverEntrada = resolve; });
}

function enviar(texto) {
  if (!resolverEntrada) return;
  const eco = document.createElement('div');
  eco.className = 'eco';
  eco.textContent = `${prompt.textContent} ${texto}`;
  bloqueAbierto = null;
  flujo.append(eco);

  const responder = resolverEntrada;
  resolverEntrada = null;
  campo.value = '';
  campo.disabled = true;
  botonEnviar.disabled = true;
  responder(texto);
}

// Botones rapidos: dependen de quien este pidiendo la linea.
const ATAJOS = {
  'memlab>': ['pista', 'saltar', 'mapa', 'ayuda'],
  'heap>': ['reservar 4', 'mapa', 'liberar 1', 'ayuda', 'listo'],
  'arreglo>': ['ver', 'reservar 4', 'copiar', 'liberar_viejo', 'ayuda', 'listo'],
  'buffer>': ['ver', 'copiar hola', 'reiniciar', 'ayuda', 'listo'],
};

function ponerAtajos(textoPrompt) {
  atajos.replaceChildren();
  for (const comando of ATAJOS[textoPrompt] ?? []) {
    const boton = document.createElement('button');
    boton.type = 'button';
    boton.textContent = comando;
    boton.addEventListener('click', () => {
      // Los comandos con argumento se dejan escritos para poder ajustarlos.
      if (comando.includes(' ')) { campo.value = comando; campo.focus(); }
      else enviar(comando);
    });
    atajos.append(boton);
  }
}

formulario.addEventListener('submit', (evento) => {
  evento.preventDefault();
  if (!campo.disabled) enviar(campo.value);
});

// --- arranque -------------------------------------------------------------

// Cada partida corre en su propia instancia del modulo: una ejecucion que se
// quedo suspendida esperando entrada no se puede reanudar ni reutilizar, asi
// que se abandona y se crea otra. 'generacion' descarta la salida de las
// instancias viejas.
let generacion = 0;

async function crearInstancia(miGeneracion) {
  return crearMemLab({
    print: (t) => { if (miGeneracion === generacion) escribir(t); },
    printErr: (t) => console.error(t),
    pedirLinea: (p) => (miGeneracion === generacion
      ? pedirLinea(p)
      : new Promise(() => {})),   // instancia abandonada: se queda dormida
  });
}

async function nuevaPartida() {
  if (resolverEntrada) {          // suelta la partida anterior
    const responder = resolverEntrada;
    resolverEntrada = null;
    responder('salir');
  }
  generacion += 1;
  const miGeneracion = generacion;

  flujo.replaceChildren();
  bloqueAbierto = null;
  campo.disabled = true;
  botonEnviar.disabled = true;
  etiquetaNivel.textContent = 'Cargando WebAssembly...';

  const modulo = await crearInstancia(miGeneracion);
  if (miGeneracion !== generacion) return;

  if (selectorNivel.options.length === 1) {
    const total = modulo.ccall('memlab_total_niveles', 'number', [], []);
    for (let i = 1; i <= total; i += 1) {
      const opcion = document.createElement('option');
      opcion.value = String(i);
      opcion.textContent = `Nivel ${i}`;
      selectorNivel.append(opcion);
    }
  }

  const semilla = Number(campoSemilla.value) || 0;
  const nivel = Number(selectorNivel.value) || 0;
  modulo.ccall('memlab_jugar', null, ['number', 'number'], [semilla, nivel]);
}

// Mantiene la barra de progreso pegada justo debajo de la cabecera.
function medirCabecera() {
  const alto = document.querySelector('.cabecera').offsetHeight;
  document.documentElement.style.setProperty('--alto-cabecera', `${alto}px`);
}
window.addEventListener('resize', medirCabecera);
medirCabecera();

botonNueva.addEventListener('click', () => { nuevaPartida(); });
nuevaPartida().catch((e) => {
  etiquetaNivel.textContent = 'No se pudo cargar el modulo WebAssembly';
  console.error(e);
});

</script>
