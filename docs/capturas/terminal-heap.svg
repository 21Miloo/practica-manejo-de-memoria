<text y="288.0"><tspan x="16.0" fill="#56d364" xml:space="preserve" textLength="344.4" lengthAdjust="spacingAndGlyphs">  Liberado el bloque #1 (0x55a3c0001000).</tspan></text>
<text y="306.5"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="562.8" lengthAdjust="spacingAndGlyphs">  Ojo: el puntero sigue guardando esa direccion. Ahora es colgante.</tspan></text>
<text y="325.0"><tspan x="16.0" fill="#56d4dd" xml:space="preserve" textLength="50.4" lengthAdjust="spacingAndGlyphs">heap&gt; </tspan><tspan x="66.4" fill="#d7e0ea" xml:space="preserve" textLength="67.2" lengthAdjust="spacingAndGlyphs">leer 1 0</tspan></text>
<text y="343.5"><tspan x="16.0" fill="#ff7b72" xml:space="preserve" textLength="294.0" lengthAdjust="spacingAndGlyphs">  USO DESPUES DE LIBERAR (lectura).</tspan></text>
<text y="362.0"><tspan x="16.0" fill="#d7e0ea" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="32.8" fill="#8b98a8" xml:space="preserve" textLength="529.2" lengthAdjust="spacingAndGlyphs">Aqui devolveria 42, el valor viejo que sigue en esos bytes. Que</tspan></text>
<text y="380.5"><tspan x="16.0" fill="#d7e0ea" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="32.8" fill="#8b98a8" xml:space="preserve" textLength="604.8" lengthAdjust="spacingAndGlyphs">'funcione' es justo lo peligroso: manana el asignador reutiliza el hueco</tspan></text>
<text y="399.0"><tspan x="16.0" fill="#d7e0ea" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="32.8" fill="#8b98a8" xml:space="preserve" textLength="151.2" lengthAdjust="spacingAndGlyphs">y devuelve basura.</tspan></text>
<text y="417.5"><tspan x="16.0" fill="#56d4dd" xml:space="preserve" textLength="50.4" lengthAdjust="spacingAndGlyphs">heap&gt; </tspan><tspan x="66.4" fill="#d7e0ea" xml:space="preserve" textLength="42.0" lengthAdjust="spacingAndGlyphs">listo</tspan></text>
