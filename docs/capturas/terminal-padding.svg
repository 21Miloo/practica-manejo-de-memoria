<text y="29.0"><tspan x="16.0" fill="#d7e0ea" font-weight="bold" xml:space="preserve" textLength="294.0" lengthAdjust="spacingAndGlyphs">Reto 5/8: El relleno que no pediste</tspan><tspan x="310.0" fill="#d7e0ea" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="326.8" fill="#8b98a8" xml:space="preserve" textLength="92.4" lengthAdjust="spacingAndGlyphs">(10 puntos)</tspan></text>
<text y="66.0"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="638.4" lengthAdjust="spacingAndGlyphs">┌──────────────────────────────────────────────────────────────────────────┐</tspan></text>
<text y="84.5"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan><tspan x="24.4" fill="#d7e0ea" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs"> </tspan><tspan x="32.8" fill="#e3b341" xml:space="preserve" textLength="504.0" lengthAdjust="spacingAndGlyphs">struct Registro { char etiqueta; int valor; char bandera; };</tspan><tspan x="536.8" fill="#d7e0ea" xml:space="preserve" textLength="109.2" lengthAdjust="spacingAndGlyphs">             </tspan><tspan x="646.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan></text>
<text y="103.0"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="638.4" lengthAdjust="spacingAndGlyphs">├──────────────────────────────────────────────────────────────────────────┤</tspan></text>
<text y="121.5"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan><tspan x="24.4" fill="#d7e0ea" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs"> </tspan><tspan x="32.8" fill="#8b98a8" xml:space="preserve" textLength="453.6" lengthAdjust="spacingAndGlyphs">campos:            1 + 4 + 1 = 6 bytes de datos utiles</tspan><tspan x="486.4" fill="#d7e0ea" xml:space="preserve" textLength="159.6" lengthAdjust="spacingAndGlyphs">                   </tspan><tspan x="646.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan></text>
<text y="140.0"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan><tspan x="24.4" fill="#d7e0ea" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs"> </tspan><tspan x="32.8" fill="#8b98a8" xml:space="preserve" textLength="159.6" lengthAdjust="spacingAndGlyphs">sizeof(Registro) = </tspan><tspan x="192.4" fill="#d7e0ea" font-weight="bold" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">12</tspan><tspan x="209.2" fill="#8b98a8" xml:space="preserve" textLength="109.2" lengthAdjust="spacingAndGlyphs"> bytes reales</tspan><tspan x="318.4" fill="#d7e0ea" xml:space="preserve" textLength="327.6" lengthAdjust="spacingAndGlyphs">                                       </tspan><tspan x="646.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan></text>
<text y="158.5"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan><tspan x="24.4" fill="#d7e0ea" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs"> </tspan><tspan x="32.8" fill="#8b98a8" xml:space="preserve" textLength="126.0" lengthAdjust="spacingAndGlyphs">alignof(int) = </tspan><tspan x="158.8" fill="#d7e0ea" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">4</tspan><tspan x="167.2" fill="#8b98a8" xml:space="preserve" textLength="436.8" lengthAdjust="spacingAndGlyphs">: 'valor' debe empezar en una direccion multiplo de </tspan><tspan x="604.0" fill="#d7e0ea" xml:space="preserve" textLength="42.0" lengthAdjust="spacingAndGlyphs">4    </tspan><tspan x="646.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan></text>
<text y="177.0"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan><tspan x="24.4" fill="#d7e0ea" xml:space="preserve" textLength="621.6" lengthAdjust="spacingAndGlyphs">                                                                          </tspan><tspan x="646.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan></text>
<text y="195.5"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan><tspan x="24.4" fill="#d7e0ea" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs"> </tspan><tspan x="32.8" fill="#8b98a8" xml:space="preserve" textLength="470.4" lengthAdjust="spacingAndGlyphs">el struct se lleno con 0xAA antes de asignar los campos:</tspan><tspan x="503.2" fill="#d7e0ea" xml:space="preserve" textLength="142.8" lengthAdjust="spacingAndGlyphs">                 </tspan><tspan x="646.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan></text>
<text y="214.0"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan><tspan x="24.4" fill="#d7e0ea" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs"> </tspan><tspan x="32.8" fill="#8b98a8" xml:space="preserve" textLength="386.4" lengthAdjust="spacingAndGlyphs">todo byte que siga en aa es relleno (padding).</tspan><tspan x="419.2" fill="#d7e0ea" xml:space="preserve" textLength="226.8" lengthAdjust="spacingAndGlyphs">                           </tspan><tspan x="646.0" fill="#8b98a8" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</tspan></text>
<text y="232.5"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="638.4" lengthAdjust="spacingAndGlyphs">└──────────────────────────────────────────────────────────────────────────┘</tspan></text>
<text y="251.0"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="117.6" lengthAdjust="spacingAndGlyphs">0x555953ba58f0</tspan><tspan x="133.6" fill="#8b98a8" xml:space="preserve" textLength="33.6" lengthAdjust="spacingAndGlyphs">  │ </tspan><tspan x="167.2" fill="#d7e0ea" xml:space="preserve" textLength="201.6" lengthAdjust="spacingAndGlyphs">41 aa aa aa 48 00 00 00 </tspan><tspan x="368.8" fill="#8b98a8" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">│ </tspan><tspan x="385.6" fill="#8b98a8" xml:space="preserve" textLength="67.2" lengthAdjust="spacingAndGlyphs">A...H...</tspan></text>
<text y="269.5"><tspan x="16.0" fill="#8b98a8" xml:space="preserve" textLength="117.6" lengthAdjust="spacingAndGlyphs">0x555953ba58f8</tspan><tspan x="133.6" fill="#8b98a8" xml:space="preserve" textLength="33.6" lengthAdjust="spacingAndGlyphs">  │ </tspan><tspan x="167.2" fill="#d7e0ea" xml:space="preserve" textLength="201.6" lengthAdjust="spacingAndGlyphs">5a aa aa aa             </tspan><tspan x="368.8" fill="#8b98a8" xml:space="preserve" textLength="16.8" lengthAdjust="spacingAndGlyphs">│ </tspan><tspan x="385.6" fill="#8b98a8" xml:space="preserve" textLength="67.2" lengthAdjust="spacingAndGlyphs">Z...    </tspan></text>
